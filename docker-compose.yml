# Local Postgres for the API. Matches DATABASE_URL in apps/api/.env.example.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashies
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dashies']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
